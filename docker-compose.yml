services:
  postgres:
    image: postgres:16-alpine
    container_name: kace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kace
      POSTGRES_PASSWORD: kace
      POSTGRES_DB: kace_dev
    ports:
      - '5432:5432'
    volumes:
      - kace-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kace -d kace_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kace-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - kace-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    container_name: kace-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - kace-mongo-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  kace-pgdata:
  kace-redis-data:
  kace-mongo-data:
